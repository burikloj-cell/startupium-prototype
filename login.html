<!DOCTYPE html>

<body>
  <header>
    <nav class="container">
      <a href="index.html" class="logo">🚀 Startupium</a>

  <div class="form-container">

      <input type="email" required placeholder="email@example.com">

      <label>Пароль</label>
      <input type="password" required>

      <button type="submit" class="btn" style="width:100%; margin-top:1.5rem;">Войти</button>
    </form>
    <p style="text-align:center; margin-top:1.5rem; color:var(--muted);">
      Нет аккаунта? <a href="register.html">Создать</a>
    </p>
  </div>
